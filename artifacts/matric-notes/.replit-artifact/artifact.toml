kind = "mobile"
previewPath = "/"
title = "Class 10 Matric Notes"
version = "1.0.0"
id = "artifacts/matric-notes"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24246

[services.development]
run = "pnpm --filter @workspace/matric-notes run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/matric-notes", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/matric-notes", "run", "serve" ]

[services.env]
PORT = "24246"
BASE_PATH = "/"
